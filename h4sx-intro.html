<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#eafaff">
<title>H4SX Store · HS Intro</title>
<style>
:root{--sky:#0ea5e9;--mint:#14b8a6}
*{box-sizing:border-box;margin:0}html,body{min-height:100%;background:#eafaff;color:#123047;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid var(--sky);outline-offset:4px}
#intro{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 42%,#ffffff 0%,#e7faff 45%,#dcf8f2 100%);transition:opacity .38s ease,visibility .38s}
#intro::before{content:'';position:absolute;width:min(76vmin,620px);aspect-ratio:1;border:1px solid #0ea5e929;border-radius:50%;box-shadow:0 0 0 85px #0ea5e90c,0 0 0 170px #14b8a608;animation:orbit 8s ease-in-out infinite alternate}
#intro::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#0ea5e90c 50%,transparent 65%);transform:translateX(-80%);animation:ambient 3.2s ease-out both;pointer-events:none}
#intro.done{opacity:0;visibility:hidden;pointer-events:none}.identity{position:relative;z-index:1;display:grid;justify-items:center;text-align:center;padding:24px;transform:translateY(-8px)}
.eyebrow{display:inline-flex;align-items:center;gap:9px;color:#1489ad;font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}.eyebrow::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 12px #14b8a655}
.logo-wrap{display:grid;place-items:center;width:clamp(144px,31vmin,210px);aspect-ratio:1;margin:28px auto 8px;padding:21px;border:1px solid #b8e9f8;border-radius:38px;background:linear-gradient(145deg,#0ea5e9,#14b8a6);box-shadow:0 24px 65px #0b93bc3d,inset 0 1px #ffffff80;opacity:0;transform:translateY(16px) scale(.94);transition:opacity .5s,transform .65s cubic-bezier(.16,1,.3,1)}.logo-wrap svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 8px 16px #09648666)}
.outline{fill:none;stroke:#e1f7ff;stroke-width:1;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}.outline.blue{stroke:#67d9ff}.draw .outline{animation:draw .9s ease forwards}.draw .outline.delay{animation-delay:.12s}.draw .outline.blue{animation-delay:.2s}.solid{opacity:0;transition:opacity .35s}.filled .solid{opacity:1}.filled .outline{opacity:0;transition:opacity .3s}.shine{opacity:0}.filled .shine{opacity:1}.shine-beam{transform:translateX(-160px)}.filled .shine-beam{animation:sweep .8s ease-in-out both}
.brand{font-size:clamp(30px,6vw,43px);font-weight:900;letter-spacing:-2px;line-height:1.1;opacity:0;transform:translateY(8px);transition:opacity .45s,transform .45s}.brand span{color:var(--sky)}.tagline{margin-top:12px;color:#526e7e;font-size:clamp(11px,2.2vw,13px);letter-spacing:.25px;opacity:0;transform:translateY(8px);transition:opacity .45s,transform .45s}.named .eyebrow,.named .brand,.named .tagline,.draw .logo-wrap{opacity:1;transform:none}
.progress{width:min(180px,44vw);height:3px;margin-top:30px;overflow:hidden;border-radius:99px;background:#0ea5e929;opacity:0;transition:opacity .4s}.progress::after{content:'';display:block;width:100%;height:100%;background:linear-gradient(90deg,#0ea5e9,var(--mint));transform:translateX(-100%);animation:load 2.35s linear forwards}.named .progress{opacity:1}
.skip{position:absolute;z-index:2;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));padding:10px 15px;border:1px solid #b8e9f8;border-radius:999px;background:#fff;color:#176386;font-size:11px;font-weight:700;opacity:0;transition:opacity .4s,background .2s}.skip:hover{background:#e7faff}.draw .skip{opacity:1}
.entering .identity{opacity:0;transform:translateY(-18px) scale(1.02);transition:opacity .28s,transform .3s}.entering .skip{opacity:0}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes sweep{to{transform:translateX(160px)}}@keyframes orbit{to{transform:scale(1.05);opacity:.55}}@keyframes ambient{to{transform:translateX(80%)}}@keyframes load{to{transform:translateX(0)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="intro" aria-label="Animasi pembukaan H4SX Store">
<div class="identity"><div class="eyebrow">H4SX DIGITAL STORE</div><div class="logo-wrap">
<svg viewBox="0 0 120 120" role="img" aria-label="Logo HS">
<defs>
<linearGradient id="white" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#c5d8ed"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#9ae6ff"/><stop offset=".5" stop-color="#40bcfa"/><stop offset="1" stop-color="#3387f5"/></linearGradient>
<!-- H dipecahkan pada bahagian persilangan supaya S nampak berjalin. -->
<path id="h-left" d="M17 16H34V52L50 68H34V104H17V74L29 86V69L17 57Z"/>
<path id="h-right" d="M85 16H103V46L85 28ZM77 60H88L103 75V104H86V82L64 60Z"/>
<path id="s" d="M53 32H84L99 47H55L82 74V88L68 102H39V86H65L43 64L37 57V47Z"/>
<clipPath id="logo-clip"><use href="#h-left"/><use href="#h-right"/><use href="#s"/></clipPath>
<linearGradient id="beam"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<g class="solid"><use href="#h-left" fill="url(#white)"/><use href="#h-right" fill="url(#white)"/><use href="#s" fill="url(#blue)"/></g>
<path class="outline" pathLength="1" d="M17 16H34V52L50 68H34V104H17V74L29 86V69L17 57Z"/>
<path class="outline delay" pathLength="1" d="M85 16H103V46L85 28ZM77 60H88L103 75V104H86V82L64 60Z"/>
<path class="outline blue" pathLength="1" d="M53 32H84L99 47H55L82 74V88L68 102H39V86H65L43 64L37 57V47Z"/>
<g class="shine" clip-path="url(#logo-clip)"><g class="shine-beam"><path d="M-40 0H-12L80 120H52Z" fill="url(#beam)"/></g></g>
</svg>
</div><div class="brand">H4SX <span>STORE</span></div><div class="tagline">Game, item dan servis digital pilihan anda.</div><div class="progress" aria-hidden="true"></div></div>
<button class="skip" type="button" id="skip-intro">Terus ke kedai →</button>
</div>
<script>
(function(){
  var intro=document.getElementById('intro');
  var finished=false;
  function finish(){
    if(finished)return;
    finished=true;
    intro.classList.add('done');
    parent.postMessage({type:'h4sx-intro-enter'},'*');
  }
  document.getElementById('skip-intro').addEventListener('click',finish);
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    intro.classList.add('filled','named');
    setTimeout(finish,250);
    return;
  }
  setTimeout(function(){intro.classList.add('draw');},100);
  setTimeout(function(){intro.classList.add('filled');},950);
  setTimeout(function(){intro.classList.add('named');},1100);
  setTimeout(function(){intro.classList.add('entering');},2550);
  setTimeout(finish,2850);
})();
</script>
</body>
</html>
