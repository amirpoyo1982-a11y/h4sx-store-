<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#70c9f5">
<title>H4SX Store · HS Intro</title>
<style>
:root{--bg:#70c9f5;--sky:#d0f2ff;--ease:cubic-bezier(.65,0,.35,1)}
*{box-sizing:border-box;margin:0}html,body{min-height:100%;background:var(--bg);color:#f2f6ff;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}a{text-decoration:none;color:inherit}button:focus-visible,a:focus-visible{outline:2px solid var(--sky);outline-offset:5px}
#intro{position:fixed;inset:0;z-index:10;background:radial-gradient(ellipse at 50% 42%,#1685d7 0%,#3ca9e8 40%,#91dbfa 85%,#c9efff 100%);display:grid;place-items:center;overflow:hidden;transition:opacity .65s ease,visibility 0s .65s}
#intro.done{opacity:0;visibility:hidden;pointer-events:none}.identity{text-align:center;position:relative;transform:translateY(-10px)}
.logo-wrap{width:clamp(160px,34vmin,235px);aspect-ratio:1;margin:auto;transform-origin:center;transition:transform 1.05s var(--ease),opacity .7s .15s;will-change:transform}.logo-wrap svg{width:100%;height:100%;display:block;overflow:visible}
.outline{fill:none;stroke:#ddecff;stroke-width:.8;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:.85}.outline.blue{stroke:#b6edff}.draw .outline{animation:draw 1.7s cubic-bezier(.5,.05,.25,1) forwards}.draw .outline.delay{animation-delay:.2s}.draw .outline.blue{animation-delay:.35s}
.solid{opacity:0;transition:opacity .8s ease}.filled .solid{opacity:1}.filled .outline{opacity:0;transition:opacity .65s}.shine{opacity:0}.filled .shine{opacity:1}.shine-beam{transform:translateX(-160px)}.filled .shine-beam{animation:sweep 1.2s .25s ease-in-out both}
.brand{font:italic bold clamp(26px,5vw,33px) Georgia,serif;letter-spacing:-.9px;margin-top:22px;opacity:0;transform:translateY(12px);transition:opacity .7s,transform .7s}.brand span{color:var(--sky)}.tagline{font-size:10px;letter-spacing:.4px;margin-top:12px;color:#e0f5ff;opacity:0;transform:translateY(8px);transition:opacity .7s .12s,transform .7s .12s}.named .brand,.named .tagline{opacity:1;transform:translateY(0)}
.entering .logo-wrap{transform:scale(17);opacity:0}.entering .brand,.entering .tagline{opacity:0;transform:translateY(12px);transition:opacity .25s,transform .4s}.halo{position:absolute;inset:-45%;border-radius:50%;background:radial-gradient(circle,#4099e510,transparent 60%);opacity:0;pointer-events:none;transition:opacity 1s}.filled .halo{opacity:1}.entering .halo{opacity:0}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes sweep{to{transform:translateX(160px)}}

/* Latar langit bergerak, dilukis dengan CSS tanpa fail gambar luaran. */
.sky-scene{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.sunlight{position:absolute;inset:-30%;background:conic-gradient(from 155deg at 65% 0%,transparent 0deg,#ffffff1a 9deg,transparent 18deg,#ffffff0d 31deg,transparent 46deg);animation:light-drift 18s ease-in-out infinite alternate}
.cloud{position:absolute;width:clamp(350px,60vw,900px);height:clamp(150px,28vw,320px);background:radial-gradient(ellipse at 20% 65%,#fff9 0,transparent 43%),radial-gradient(ellipse at 42% 47%,#ffff 0,transparent 40%),radial-gradient(ellipse at 65% 60%,#fffd 0,transparent 42%),radial-gradient(ellipse at 82% 75%,#fff9 0,transparent 43%);filter:blur(14px);will-change:transform;animation:cloud-drift 22s ease-in-out infinite alternate}
.c1{left:-20%;bottom:-9%;opacity:.85}.c2{right:-28%;bottom:0;opacity:.72;animation-delay:-9s;animation-duration:26s}.c3{left:-24%;top:0%;opacity:.35;transform:scale(.7);animation-duration:32s;animation-delay:-17s}.c4{right:-28%;top:-8%;opacity:.5;animation-duration:28s;animation-delay:-11s}.c5{left:15%;bottom:-23%;width:90vw;opacity:.9;animation-duration:30s;animation-delay:-15s}
.identity{z-index:1}.logo-wrap svg{filter:drop-shadow(0 12px 18px #075d982f)}.brand{text-shadow:0 3px 16px #07588f35}.halo{background:radial-gradient(circle,#daf6ff1a,transparent 65%)}
.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff8;opacity:0;animation:spark-float 6s ease-in-out infinite}.p1{left:22%;top:32%;animation-delay:-1s}.p2{left:77%;top:57%;animation-delay:-3s}.p3{left:64%;top:22%;animation-delay:-4s}.p4{left:31%;top:73%;animation-delay:-2s}.p5{left:85%;top:36%;animation-delay:-5s}.p6{left:52%;top:83%;animation-delay:-.5s}
@keyframes cloud-drift{from{transform:translate3d(-25px,8px,0)}to{transform:translate3d(45px,-14px,0)}}
@keyframes light-drift{to{transform:rotate(6deg);opacity:.6}}
@keyframes spark-float{0%,100%{opacity:0;transform:translateY(12px) scale(.5)}45%{opacity:.65}70%{opacity:.1;transform:translateY(-22px) scale(1)}}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.logo-wrap{will-change:auto}}
</style>
</head>
<body>

<div id="intro" aria-label="Animasi pembukaan H4SX Store">
<div class="sky-scene" aria-hidden="true">
  <div class="sunlight"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div>
  <div class="cloud c3"></div><div class="cloud c4"></div>
  <div class="cloud c5"></div>
  <i class="spark p1"></i><i class="spark p2"></i><i class="spark p3"></i>
  <i class="spark p4"></i><i class="spark p5"></i><i class="spark p6"></i>
</div>
<div class="identity"><div class="halo" aria-hidden="true"></div><div class="logo-wrap">
<svg viewBox="0 0 120 120" role="img" aria-label="Logo HS">
<defs>
<linearGradient id="white" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#c5d8ed"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#9ae6ff"/><stop offset=".5" stop-color="#40bcfa"/><stop offset="1" stop-color="#3387f5"/></linearGradient>
<!-- H dipecahkan pada bahagian persilangan supaya S nampak berjalin. -->
<path id="h-left" d="M17 16H34V52L50 68H34V104H17V74L29 86V69L17 57Z"/>
<path id="h-right" d="M85 16H103V46L85 28ZM77 60H88L103 75V104H86V82L64 60Z"/>
<path id="s" d="M53 32H84L99 47H55L82 74V88L68 102H39V86H65L43 64L37 57V47Z"/>
<clipPath id="logo-clip"><use href="#h-left"/><use href="#h-right"/><use href="#s"/></clipPath>
<linearGradient id="beam"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<g class="solid"><use href="#h-left" fill="url(#white)"/><use href="#h-right" fill="url(#white)"/><use href="#s" fill="url(#blue)"/></g>
<path class="outline" pathLength="1" d="M17 16H34V52L50 68H34V104H17V74L29 86V69L17 57Z"/>
<path class="outline delay" pathLength="1" d="M85 16H103V46L85 28ZM77 60H88L103 75V104H86V82L64 60Z"/>
<path class="outline blue" pathLength="1" d="M53 32H84L99 47H55L82 74V88L68 102H39V86H65L43 64L37 57V47Z"/>
<g class="shine" clip-path="url(#logo-clip)"><g class="shine-beam"><path d="M-40 0H-12L80 120H52Z" fill="url(#beam)"/></g></g>
</svg>
</div><div class="brand">H4SX<span>Store</span></div><div class="tagline">Your world of gaming &amp; digital.</div></div>
</div>
<script>
(function(){
  var intro=document.getElementById('intro');
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    intro.classList.add('filled','named');
    setTimeout(function(){parent.postMessage({type:'h4sx-intro-enter'},'*');},450);
    return;
  }
  setTimeout(function(){intro.classList.add('draw');},180);
  setTimeout(function(){intro.classList.add('filled');},2250);
  setTimeout(function(){intro.classList.add('named');},2700);
  setTimeout(function(){intro.classList.add('entering');},5250);
  setTimeout(function(){
    intro.classList.add('done');
    document.dispatchEvent(new CustomEvent('intro:done'));
    parent.postMessage({type:'h4sx-intro-enter'},'*');
  },5900);
})();
</script>
</body>
</html>
